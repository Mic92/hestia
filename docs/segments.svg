<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c2603e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b8a5c"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size: 15px; font-weight: 600; fill: #2b3a49; }
    .h2 { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .t  { font-size: 12px; fill: #3d4c5c; }
    .ts { font-size: 11px; fill: #6b7a89; }
    .m  { font-size: 11.5px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #34424f; }
    .ms { font-size: 10.5px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #6b7a89; }
    .mw { font-size: 11.5px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #ffffff; }
    .edge { stroke: #5b6b7a; stroke-width: 1.4; fill: none; }
    .edge-accent { stroke: #c2603e; stroke-width: 1.6; fill: none; }
    .edge-green { stroke: #3b8a5c; stroke-width: 1.6; fill: none; }
    .cell { fill: #dde7ee; stroke: #b9c5d2; }
    .cellz { fill: #eef2f6; stroke: #b9c5d2; }
  </style>

  <!-- ======================= store ======================= -->
  <rect x="20" y="20" width="1000" height="170" rx="10" fill="#f4f6f9" stroke="#cdd6e0"/>
  <text x="40" y="48" class="h1">Store &#8212; immutable objects</text>

  <!-- heads -->
  <text x="40" y="78" class="t">heads</text>
  <rect x="40"  y="90" width="92" height="34" rx="6" fill="#e6ebf1" stroke="#b9c5d2"/>
  <text x="86"  y="111" class="m" text-anchor="middle">g-7-…</text>
  <rect x="150" y="90" width="92" height="34" rx="6" fill="#3f5e85" stroke="#33506f"/>
  <text x="196" y="111" class="mw" text-anchor="middle">h-7-main-…</text>
  <rect x="260" y="90" width="92" height="34" rx="6" fill="#3f5e85" stroke="#33506f"/>
  <text x="306" y="111" class="mw" text-anchor="middle">c-7-main-…</text>
  <path class="edge" d="M 150 107 L 136 107" marker-end="url(#arrow)"/>
  <path class="edge" d="M 306 124 L 306 131 L 86 131 L 86 127" marker-end="url(#arrow)"/>
  <text x="40" y="148" class="ts">view = newest g-N + h-/c- heads based on it</text>
  <text x="40" y="164" class="ts">g: GC epoch · h: one drain · c: a root compacted</text>

  <!-- segment objects -->
  <text x="420" y="78" class="t">segments</text>
  <rect x="420" y="90" width="150" height="34" rx="6" fill="#e6ebf1" stroke="#b9c5d2"/>
  <text x="495" y="111" class="m" text-anchor="middle">seg-71c0…  (.meta)</text>
  <rect x="420" y="130" width="150" height="34" rx="6" fill="#e6ebf1" stroke="#b9c5d2"/>
  <text x="495" y="151" class="m" text-anchor="middle">tree-71c0…  (.tree)</text>

  <!-- packs -->
  <text x="640" y="78" class="t">packs</text>
  <rect x="640" y="90" width="260" height="34" rx="6" fill="#e6ebf1" stroke="#b9c5d2"/>
  <rect x="900" y="90" width="90" height="34" rx="6" fill="#dfe7f0" stroke="#b9c5d2"/>
  <text x="770" y="111" class="m" text-anchor="middle">pack-3fa9…  frames (64 MiB)</text>
  <text x="945" y="111" class="ms" text-anchor="middle">index 40 KB</text>
  <rect x="640" y="130" width="260" height="34" rx="6" fill="#e6ebf1" stroke="#b9c5d2"/>
  <rect x="900" y="130" width="90" height="34" rx="6" fill="#dfe7f0" stroke="#b9c5d2"/>
  <text x="770" y="151" class="m" text-anchor="middle">pack-b21c…</text>
  <text x="945" y="151" class="ms" text-anchor="middle">index</text>
  <text x="640" y="180" class="ts">index is a trailer: one content address, one extra Range read</text>

  <!-- head -> decoded -->
  <path class="edge" d="M 250 124 C 250 170, 200 200, 200 222" marker-end="url(#arrow)"/>

  <!-- ======================= head ======================= -->
  <rect x="20" y="224" width="360" height="236" rx="10" fill="#fbfcfd" stroke="#cdd6e0"/>
  <text x="40" y="250" class="h1">g (GC) and h/c (writer) records</text>
  <rect x="40" y="264" width="320" height="24" rx="4" fill="#3f5e85"/>
  <text x="50" y="281" class="h2">Heads</text>
  <rect x="40" y="288" width="320" height="156" fill="#ffffff" stroke="#cdd6e0"/>
  <text x="50" y="306" class="m">g: epoch: 7, time</text>
  <text x="50" y="322" class="ms">roots: [ (main-x86_64-linux, 71c0…, stamp),</text>
  <text x="50" y="336" class="ms">         (pr-512-aarch64-darwin, c3d1…, stamp) ]</text>
  <text x="50" y="350" class="ms">retired: [seg…]  folded: [h-…, g-6]</text>
  <text x="50" y="364" class="ms">origin: [(seg, identity)]</text>
  <text x="50" y="384" class="m">h/c: base_epoch: 7, root: main-…</text>
  <text x="50" y="400" class="ms">h: adds seg 9e2d…   c: one seg replaces the root's</text>
  <text x="50" y="414" class="ms">+ sigstore bundle when trust is on</text>
  <text x="50" y="432" class="ms">GC g+1 deletes what g retired. No other clock.</text>
  <text x="40" y="455" class="ts" fill="#3b8a5c">narinfo: head + .meta</text>

  <path class="edge-green" d="M 360 322 L 398 322" marker-end="url(#arrow-green)"/>

  <!-- ======================= .meta ======================= -->
  <rect x="400" y="224" width="620" height="236" rx="10" fill="#fbfcfd" stroke="#cdd6e0"/>
  <text x="420" y="250" class="h1">.meta &#8212; narinfo data, zstd</text>

  <text x="420" y="276" class="t">header</text>
  <rect x="470" y="262" width="530" height="22" class="cell"/>
  <text x="480" y="277" class="ms">packs: [(PackHash, size, chunks, live_count, live_bits)…], tree, features</text>

  <text x="420" y="308" class="t">index</text>
  <rect x="470" y="294" width="40"  height="22" class="cell"/>
  <rect x="510" y="294" width="170" height="22" class="cell"/>
  <rect x="680" y="294" width="170" height="22" class="cell"/>
  <rect x="850" y="294" width="150" height="22" class="cell"/>
  <text x="490" y="309" class="ms" text-anchor="middle">n</text>
  <text x="595" y="309" class="ms" text-anchor="middle">u64 prefix[n]  (sorted)</text>
  <text x="765" y="309" class="ms" text-anchor="middle">12 B tail[n]</text>
  <text x="925" y="309" class="ms" text-anchor="middle">u32 off[n+1]</text>
  <text x="470" y="332" class="ts">sorted by PathHash, ~40 ns lookup</text>

  <text x="420" y="362" class="t">bodies</text>
  <rect x="470" y="348" width="130" height="22" class="cell"/>
  <rect x="600" y="348" width="130" height="22" fill="#f2d9cd" stroke="#c2603e" stroke-width="1.5"/>
  <rect x="730" y="348" width="60"  height="22" class="cell"/>
  <rect x="790" y="348" width="210" height="22" class="cell"/>
  <text x="535" y="363" class="ms" text-anchor="middle">body 0</text>
  <text x="665" y="363" class="ms" text-anchor="middle">body i</text>
  <text x="760" y="363" class="ms" text-anchor="middle">…</text>
  <text x="895" y="363" class="ms" text-anchor="middle">body n-1</text>
  <rect x="470" y="380" width="530" height="66" fill="#ffffff" stroke="#cdd6e0"/>
  <text x="480" y="396" class="m">u8 name_len | name | cbor {</text>
  <text x="494" y="411" class="ms">nar_hash, nar_size, deriver, ca,</text>
  <text x="494" y="425" class="ms">local_refs: bytes of u32 → row in this segment,  foreign_refs: "p1 p2 …"</text>
  <text x="480" y="440" class="m">}</text>
  <path class="edge" d="M 665 370 L 665 380" />

  <!-- ======================= .tree ======================= -->
  <rect x="20" y="478" width="600" height="302" rx="10" fill="#fbfcfd" stroke="#cdd6e0"/>
  <text x="40" y="504" class="h1">.tree &#8212; file lists, Range-readable</text>

  <text x="40" y="530" class="t">index</text>
  <rect x="90" y="516" width="330" height="22" class="cell"/>
  <text x="255" y="531" class="ms" text-anchor="middle">n | prefix[n] | tail[n] | off[n+1]   (raw)</text>
  <rect x="420" y="516" width="180" height="22" class="cell"/>
  <text x="510" y="531" class="ms" text-anchor="middle">u32 frame_off[f+1]</text>

  <text x="40" y="564" class="t">frames</text>
  <rect x="90"  y="550" width="150" height="22" class="cellz"/>
  <rect x="240" y="550" width="170" height="22" fill="#f2d9cd" stroke="#c2603e" stroke-width="1.5"/>
  <rect x="410" y="550" width="60"  height="22" class="cellz"/>
  <rect x="470" y="550" width="130" height="22" class="cellz"/>
  <text x="165" y="565" class="ms" text-anchor="middle">zstd(bodies 0…255)</text>
  <text x="325" y="565" class="ms" text-anchor="middle">zstd(bodies 256…511)</text>
  <text x="440" y="565" class="ms" text-anchor="middle">…</text>
  <text x="535" y="565" class="ms" text-anchor="middle">~150 KB each</text>
  <text x="90" y="588" class="ts">row i → frame i/256</text>

  <rect x="90" y="600" width="510" height="112" fill="#ffffff" stroke="#cdd6e0"/>
  <text x="100" y="618" class="m">body i = cbor [</text>
  <text x="114" y="634" class="ms">{ name: "bin/hello", exec: true,</text>
  <text x="114" y="650" class="ms">  chunks: bytes of (u16 pack_idx, u16 chunk_idx) … },</text>
  <text x="114" y="666" class="ms">{ name: "share/man/…", chunks: … },  …</text>
  <text x="100" y="682" class="m">]</text>
  <path class="edge" d="M 325 572 L 325 600"/>

  <text x="40" y="736" class="ts">writer: adds a segment.  GC: merges a root's segments, deletes unreferenced packs.</text>

  <!-- ======================= pack ======================= -->
  <rect x="640" y="478" width="380" height="302" rx="10" fill="#f4f6f9" stroke="#cdd6e0"/>
  <text x="660" y="504" class="h1">pack = frames + index trailer</text>

  <text x="660" y="530" class="t">index  (magic | n | 32 B rows)</text>
  <rect x="660" y="540" width="340" height="24" rx="4" fill="#3f5e85"/>
  <text x="670" y="557" class="h2">chunk_idx &#8594; (Blake3Chunk, offset, zsize, size)</text>
  <rect x="660" y="564" width="340" height="58" fill="#ffffff" stroke="#cdd6e0"/>
  <text x="670" y="582" class="ms">0 → c44d…, 0, 18 KiB, 64 KiB</text>
  <text x="670" y="597" class="ms" fill="#c2603e">7 → 9b1e…, 131072, 22 KiB, 64 KiB</text>
  <text x="670" y="612" class="ms">…</text>

  <text x="660" y="650" class="t">frames  (index at offset = packs[].size)</text>
  <rect x="660" y="660" width="80"  height="30" class="cell"/>
  <rect x="740" y="660" width="120" height="30" fill="#f2d9cd" stroke="#c2603e" stroke-width="1.5"/>
  <rect x="860" y="660" width="50"  height="30" class="cell"/>
  <rect x="910" y="660" width="90"  height="30" class="cell"/>
  <text x="700" y="679" class="ms" text-anchor="middle">zstd(chunk)</text>
  <text x="800" y="679" class="ms" text-anchor="middle">zstd(chunk 7)</text>
  <text x="885" y="679" class="ms" text-anchor="middle">…</text>
  <text x="955" y="679" class="ms" text-anchor="middle">zstd(chunk)</text>
  <line x1="740" y1="690" x2="740" y2="696" stroke="#c2603e" stroke-width="1.5"/>
  <text x="740" y="708" class="ts">offset</text>
  <path class="edge-accent" d="M 760 622 L 760 656" marker-end="url(#arrow-accent)"/>
  <text x="660" y="740" class="ts" fill="#c2603e">one chunk = one Range read</text>

  <!-- cross edges -->
  <!-- .tree body -> pack idx -->
  <path class="edge-accent" d="M 600 652 L 630 652 L 630 597 L 656 597" marker-end="url(#arrow-accent)"/>
  <text x="636" y="636" class="ts" fill="#c2603e">chunk_idx</text>
  <!-- .tree pack_idx -> .meta packs -->
  <path class="edge" d="M 600 626 L 622 626 L 622 473 L 1010 473 L 1010 288" marker-end="url(#arrow)"/>
  <text x="950" y="465" class="ts">pack_idx</text>
  <!-- NAR path: .meta row i -> .tree row i -->
  <path class="edge-accent" d="M 520 446 L 520 466 L 632 466 L 632 561 L 604 561" marker-end="url(#arrow-accent)"/>
  <text x="455" y="470" class="ts" fill="#c2603e">NAR: row i</text>
</svg>
