name: hestia-cache
# Marketplace limits this to 125 characters; the long-form blurb lives in
# action/README.md.
description: >
  Nix binary cache backed by the GitHub Actions cache (v2 API). Wires a
  substituter and post-build-hook into nix.conf.

branding:
  icon: archive
  color: purple

inputs:
  binary:
    description: >
      Path to a pre-built hestia binary (e.g. the result of `nix build`).
      Takes precedence over `version`.
    required: false
    default: ""
  version:
    description: >
      Hestia release tag to download from GitHub releases
      (e.g. "v0.1.0-beta.1"), or "latest" to auto-resolve the newest
      release.  The downloaded binary is verified against GitHub's build
      provenance attestations before it runs.
    required: false
    default: "latest"
  github-token:
    description: >
      Token for listing cache entries to find what earlier jobs cached
      (needs `actions: read`, nothing is substituted without it) and for
      the attestation API lookup that verifies downloaded release binaries.
    required: false
    default: ${{ github.token }}
  listen:
    description: >
      Address the substituter HTTP server listens on. Defaults to 127.0.0.1
      with a free port picked per invocation, so the action can run more
      than once in a job without the daemons colliding.
    required: false
    default: ""
  socket:
    description: >
      Unix socket path for the post-build-hook listener. Defaults to a
      per-invocation path under the runner's temp directory.
    required: false
    default: ""
  drain-timeout:
    description: >
      Maximum number of seconds the post-job step waits for the final upload
      (chunking, pack upload, publish).
    required: false
    default: "300"
  upstream-cache-filter:
    description: >
      Skip paths signed by an upstream cache (cache.nixos.org by default)
      instead of caching them. Saves GHA cache quota for projects with big
      nixpkgs closures.
    required: false
    default: "false"
  upstream-cache-key-names:
    description: >
      Space-separated signing key names treated as upstream caches by
      `upstream-cache-filter`.
    required: false
    default: ""
  filter-drv-closures:
    description: >
      Apply upstream-cache-filter to registered derivation closures. Requires
      `upstream-cache-filter`; use `hestia prefetch` to retain bulk closure
      fetching.
    required: false
    default: "false"
  oci:
    description: >
      `<registry>/<repository>` (e.g. `ghcr.io/OWNER/REPO/hestia`) to
      store in an OCI registry instead of the Actions cache. On ghcr.io
      `github-token` is the credential (needs `packages: write` to upload,
      public packages substitute anonymously).
    required: false
    default: ""
  s3:
    description: >
      `s3://BUCKET/PREFIX` to store in an S3-compatible bucket instead of
      the Actions cache. Credentials come from `AWS_ACCESS_KEY_ID`,
      `AWS_SECRET_ACCESS_KEY` (and `AWS_SESSION_TOKEN`) in `env`, the
      region from `AWS_REGION`.
    required: false
    default: ""
  s3-endpoint:
    description: >
      Endpoint URL for non-AWS stores (MinIO, R2, Garage, Ceph, ...),
      addressed path-style.
    required: false
    default: ""
  read-only:
    description: >
      Substitute from the cache but never write to it: no post-build-hook,
      no drain, and the daemon refuses uploads. For jobs that should only
      consume what a central job cached.
    required: false
    default: "false"
  no-closure:
    description: >
      Cache built paths only, without their runtime closure (dependencies
      stay on upstream caches).
    required: false
    default: "false"
  wait-head:
    description: >
      Wait up to 60s at daemon startup until this head is listed. Matrix
      build jobs pass the eval job's `head` output so the just-uploaded drv
      closures are visible despite GHA cache listing lag.
    required: false
  wait-manifest-version:
    description: Deprecated alias of `wait-head`.
    required: false
    default: ""

# If both `binary` and `version` are explicitly empty, the action only
# captures and exports the cache tokens (ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL).
# That mode exists for setups that run hestia themselves -- for example
# hestia's own integration tests against the real cache API.

runs:
  using: node24
  # Deprecated entry point; see deprecated-main.js.
  main: deprecated-main.js
  post: deprecated-post.js
